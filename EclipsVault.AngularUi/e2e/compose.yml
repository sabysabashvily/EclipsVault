# Separate from the laptop's development stack: fresh storage and no published SQL port.
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2025-latest@sha256:ca62ad2d75975074cbc9ac39a1329cd88af9cd3ea2ffb59d6302579a97cf32f4
    platform: linux/amd64
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${E2E_SQL_PASSWORD:?Set by run.mjs}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" > /dev/null',
        ]
      interval: 2s
      timeout: 5s
      retries: 90

  redis:
    image: redis:7.4-alpine@sha256:858f009f9709ce576febc734aa78b8f6d624b82571f9ddb6bda4377c833b3499
    environment:
      REDISCLI_AUTH: ${E2E_REDIS_PASSWORD:?Set by run.mjs}
    command:
      [
        'sh',
        '-c',
        'exec redis-server --requirepass "$$REDISCLI_AUTH" --maxmemory-policy noeviction',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli ping | grep -q PONG']
      interval: 2s
      timeout: 5s
      retries: 90

  smtp:
    image: axllent/mailpit:v1.27.8@sha256:6abc8e633df15eaf785cfcf38bae48e66f64beecdc03121e249d0f9ec15f0707
    ports: ['127.0.0.1::8025']

  vault:
    image: ${E2E_IMAGE:?Set by run.mjs}
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Redis__Enabled: 'true'
      Redis__Configuration: redis:6379,password=${E2E_REDIS_PASSWORD:?Set by run.mjs}
      Redis__SessionIncarnation: ${E2E_COMPOSE_PROJECT:?Set by run.mjs}
      AllowedHosts: localhost
      ForwardedHeaders__KnownProxies__0: ${E2E_PROXY_IP:?Set by run.mjs}
      ConnectionStrings__DefaultConnection: Server=sql;Database=EclipsVault;User Id=sa;Password=${E2E_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Database__MigrateOnStartup: 'true'
      Seed__AdminPassword: ${Seed__AdminPassword:?Supply a unique test password}
      ECLIPSVAULT_KEK: ${ECLIPSVAULT_KEK:?Supply a base64 32-byte test KEK}
      ECLIPSVAULT_AUDIT_SIGNING_KEY: ${ECLIPSVAULT_AUDIT_SIGNING_KEY:?Set by run.mjs}
      DataProtection__KeyRingPath: /tmp/keyring
      Email__Enabled: 'true'
      Email__Sender: Smtp
      Email__Smtp__Host: smtp
      Email__Smtp__Port: '1025'
      WebAuthn__Origins__0: ${E2E_BASE_URL:-https://localhost}
      # The access grid must have the same expected result at every hour of the day.
      Abac__ProductionWindowStartUtcHour: '0'
      Abac__ProductionWindowEndUtcHour: '24'
      Sso__Enabled: 'true'
      Sso__Authority: '${E2E_SSO_AUTHORITY:?Set by run.mjs}'
      Sso__ClientId: eclipsvault-e2e
      Sso__ClientSecret: '${E2E_SSO_CLIENT_SECRET:?Set by run.mjs}'
      Sso__DisplayName: Keycloak
      Sso__TrustIdpMultiFactor: 'true'
      # Discovery and the token endpoint are the proxy's HTTPS URL. Plain HTTP stays off.
      Sso__AllowInsecureHttp: 'false'
      SSL_CERT_FILE: /etc/ssl/e2e/ca-bundle.crt
    extra_hosts:
      - 'keycloak.localhost:${E2E_PROXY_IP:?Set by run.mjs}'
    volumes:
      - '${E2E_CA_BUNDLE:?Set by run.mjs}:/etc/ssl/e2e/ca-bundle.crt:ro'
    depends_on:
      redis:
        condition: service_healthy
      smtp:
        condition: service_started
      sql:
        condition: service_healthy
      keycloak:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7@sha256:9409c59bdfb65dbffa20b11e6f18b8abb9281d480c7ca402f51ed3d5977e6007
    command: ['start-dev', '--import-realm']
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: e2e-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${E2E_KEYCLOAK_ADMIN_PASSWORD:?Set by run.mjs}
      KC_HEALTH_ENABLED: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_HOSTNAME: 'https://keycloak.localhost:${E2E_HTTPS_PORT:?Set by run.mjs}'
      # The admin client and the health check use the container's own address. The issuer stays
      # the hostname above, which is a full URL.
      KC_HOSTNAME_STRICT: 'false'
      KC_PROXY_HEADERS: xforwarded
    volumes:
      - '${E2E_REALM_FILE:?Set by run.mjs}:/opt/keycloak/data/import/e2e-realm.json:ro'
    healthcheck:
      test:
        [
          'CMD',
          'bash',
          '-c',
          'exec 3<>/dev/tcp/127.0.0.1/9000; printf "GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; grep -q UP <&3',
        ]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 15s

  proxy:
    image: caddy:2.11.6@sha256:13b7fbadd017b042956fddbceedeeea12bb1e560534f9b3df281269dbcc61813
    environment:
      E2E_HTTPS_PORT: ${E2E_HTTPS_PORT:?Set by run.mjs}
    ports:
      - '127.0.0.1:${E2E_HTTPS_PORT:?Set by run.mjs}:${E2E_HTTPS_PORT:?Set by run.mjs}'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
