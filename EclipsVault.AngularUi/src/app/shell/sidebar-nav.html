<nav class="sidenav" aria-label="Main navigation">
  @for (section of sections(); track section.label) {
    @if (section.label) {
      <span class="nav-section">{{ section.label }}</span>
    } @else {
      <span class="nav-gap" aria-hidden="true"></span>
    }
    @for (item of section.items; track item.label) {
      @if ('children' in item) {
        <details class="nav-group" [attr.aria-label]="item.label" [open]="groupExpanded(item)">
          <summary
            class="nav-item nav-group-summary"
            [class.has-active]="groupActive(item)"
            [attr.aria-label]="railLabel(item)"
            [attr.title]="collapsed() ? item.label : null"
            (click)="groupSummaryClicked($event, item)"
          >
            <app-nav-icon [icon]="item.icon" />
            <span class="nav-label">{{ item.label }}</span>
            <svg
              class="nav-chevron"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="1.9"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M9 6l6 6-6 6" />
            </svg>
          </summary>
          <div class="nav-group-items">
            @for (child of item.children; track child.label) {
              <ng-container
                [ngTemplateOutlet]="link"
                [ngTemplateOutletContext]="{ $implicit: child }"
              />
            }
          </div>
        </details>
      } @else {
        <ng-container [ngTemplateOutlet]="link" [ngTemplateOutletContext]="{ $implicit: item }" />
      }
    }
  }
</nav>

<ng-template #link let-entry>
  <a
    class="nav-item"
    [routerLink]="entry.url"
    [class.active]="holds(entry)"
    [attr.aria-current]="active(entry) ? 'page' : holds(entry) ? 'true' : null"
    [attr.aria-label]="collapsed() ? entry.label : null"
    [attr.title]="collapsed() ? entry.label : null"
  >
    <app-nav-icon [icon]="entry.icon" />
    <span class="nav-label">{{ entry.label }}</span>
  </a>
</ng-template>
