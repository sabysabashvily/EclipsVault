# The reference production deployment: Caddy (automatic HTTPS) in front of the vault, with
# PostgreSQL, on one host. docs/INSTALL.md ("Quickest path") walks through it.
#
# Every value comes from .env beside this file (start from .env.example); nothing secret belongs in
# this file. Run from this folder:
#
#   docker compose up -d
#
# Images are pinned by digest, except the vault's, which is the signed release you verified
# (docs/VERIFYING.md), set in .env. A floating tag means the image that starts tomorrow is not the
# one you tested.
#
# Persistent state lives in named volumes: the database, the Data Protection key ring, and Caddy's
# certificates. `docker compose down` keeps them; `down -v` deletes them, and with them every secret.

name: eclipsvault

services:
  caddy:
    image: caddy:2.11.6@sha256:13b7fbadd017b042956fddbceedeeea12bb1e560534f9b3df281269dbcc61813
    restart: unless-stopped
    environment:
      EV_DOMAIN: ${EV_DOMAIN:?Set EV_DOMAIN in .env}
    ports:
      - '80:80' # the certificate authority's HTTP challenge, and the redirect to HTTPS
      - '443:443'
      - '443:443/udp' # HTTP/3, which Caddy advertises to browsers
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and the ACME account. Losing them means issuing again, which is rate-limited.
      - caddy-data:/data
      - caddy-config:/config
    networks:
      vault:
        # Fixed, because the vault trusts forwarded client addresses from this one address only.
        ipv4_address: 172.31.255.2
    depends_on:
      - vault

  vault:
    image: ${EV_IMAGE:?Set EV_IMAGE in .env to the signed image digest you verified}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      AllowedHosts: ${EV_DOMAIN:?Set EV_DOMAIN in .env}
      ForwardedHeaders__KnownProxies__0: 172.31.255.2
      Identity__PublicUrl: https://${EV_DOMAIN}
      WebAuthn__RelyingPartyId: ${EV_DOMAIN}
      WebAuthn__Origins__0: https://${EV_DOMAIN}
      Database__Provider: Postgres
      # No deploy pipeline on a single host, so the vault applies its own migrations. Its login owns
      # the database for that, which is why it is a dedicated login and not the superuser.
      Database__MigrateOnStartup: 'true'
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=eclipsvault;Username=eclipsvault_app;Password=${EV_DB_APP_PASSWORD:?Set EV_DB_APP_PASSWORD in .env}
      ECLIPSVAULT_KEK: ${ECLIPSVAULT_KEK:?Set ECLIPSVAULT_KEK in .env}
      ECLIPSVAULT_AUDIT_SIGNING_KEY: ${ECLIPSVAULT_AUDIT_SIGNING_KEY:?Set ECLIPSVAULT_AUDIT_SIGNING_KEY in .env}
      # Read only on an empty vault, to create vault-admin. Clear it in .env after the first start.
      Seed__AdminPassword: ${Seed__AdminPassword:-}
      # Blank runs Community.
      ECLIPSVAULT_LICENSE: ${ECLIPSVAULT_LICENSE:-}
      DataProtection__KeyRingPath: /keyring
    volumes:
      - keyring:/keyring
    networks:
      - vault
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    restart: unless-stopped
    environment:
      # The superuser, for backups and restores. The vault signs in as eclipsvault_app instead.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: eclipsvault
      EV_DB_APP_PASSWORD: ${EV_DB_APP_PASSWORD:?Set EV_DB_APP_PASSWORD in .env}
    volumes:
      - postgres:/var/lib/postgresql/data
      # Runs once, when the data volume is empty.
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/postgres-init.sh:ro
    networks:
      - vault
    healthcheck:
      # Over TCP rather than the socket: on first start the image creates the database with a
      # temporary server that listens on the socket only, which would pass the check too early.
      test: ['CMD', 'pg_isready', '--host=127.0.0.1', '--username=postgres', '--dbname=eclipsvault']
      interval: 5s
      timeout: 5s
      retries: 12

networks:
  vault:
    ipam:
      config:
        # Change these and both 172.31.255.2 addresses above together if they collide with a network
        # on your host; `docker compose up` refuses to start on an overlap.
        - subnet: 172.31.255.0/24
          # Other containers get addresses from the upper half, so none can take the proxy's.
          ip_range: 172.31.255.128/25

volumes:
  caddy-data:
  caddy-config:
  keyring:
  postgres:
