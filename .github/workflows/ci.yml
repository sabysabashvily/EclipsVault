name: CI

on:
  # `push` watches main; `pull_request` watches everything on its way there. Listening to both on
  # every branch meant each commit on a branch with an open PR ran the whole suite TWICE — double the
  # minutes, and two independent chances to hit the intermittent test hang, so roughly one PR in five
  # went red for a reason that had nothing to do with the change.
  #
  # Little loses coverage that had it. A stacked PR fires `pull_request` against its own base, so
  # chained branches are still built, and main is still built on every merge. The one gap is a branch
  # with no pull request open at all — `workflow_dispatch` covers that on demand, which is a better
  # trade than running everything twice forever for the rare branch that sits unopened.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only, whatever the repository's default is. Every job here builds, tests or scans, and each one
# runs third-party code (packages, tools, actions) that has no use for a token that can write.
permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Locked-mode restore fails if packages.lock.json is out of date — guarantees the
      # committed lockfile matches Directory.Packages.props (reproducible builds).
      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        # --blame-hang-timeout aborts (with a dump naming the culprit) if a test hangs, rather than
        # letting one stuck test block the job to the 6h ceiling. The suite runs in seconds, so 5m is
        # only ever reached by a genuine hang.
        # The unit project only: the integration project needs Docker and has its own job below.
        run: dotnet test EclipsVault.Tests --configuration Release --no-build --verbosity normal --blame-hang-timeout 5m --blame-hang-dump-type mini

      # The step above has been promising a dump "naming the culprit" since PR #32, and the dump was
      # thrown away with the runner every time — which is most of why the intermittent hang has never
      # been root-caused. The blame collector writes Sequence_*.xml naming the tests still in flight
      # when it gave up, plus a minidump of the stuck process; both are the actual evidence, and the
      # console log is not (its output is buffered, so the last test printed before the silence is not
      # the one that hung).
      #
      # Only on failure: a clean run deletes its own sequence file, so there is nothing to collect.
      - name: Upload hang evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-hang-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: EclipsVault.Tests/TestResults/**
          if-no-files-found: ignore
          retention-days: 30

      # The build already fails on misformatted C# (IDE0055). This also catches what the build
      # cannot: using order, a missing final newline, a byte-order mark. It runs after the tests so
      # a formatting slip never hides their result. Fix a failure with `dotnet format`.
      - name: C# formatting
        run: dotnet format EclipsVault.slnx --verify-no-changes --no-restore

  # The HTTP integration tests (ADR-0010): the unmodified app in Production against a real SQL Server
  # that Testcontainers starts on the runner's Docker, signed in through the real sign-in. Kept out of
  # build-test so the unit suite stays Docker-free and fast. The hang timeout is longer than the unit
  # job's because it also covers pulling and starting SQL Server before the first test.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Build
        run: dotnet build EclipsVault.IntegrationTests --configuration Release --no-restore

      # Header tests serve the real Angular document through its route table.
      - name: Setup Node for Angular documents
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: EclipsVault.AngularUi/.nvmrc
          cache: npm
          cache-dependency-path: EclipsVault.AngularUi/package-lock.json

      - name: Build Angular documents
        working-directory: EclipsVault.AngularUi
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Integration tests
        run: dotnet test EclipsVault.IntegrationTests --configuration Release --no-build --verbosity normal --blame-hang-timeout 10m --blame-hang-dump-type mini

      - name: Upload hang evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-hang-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: EclipsVault.IntegrationTests/TestResults/**
          if-no-files-found: ignore
          retention-days: 30

  # The Angular UI (ADR-0015), held to the npm supply-chain rules (ADR-0003). `npm run build` runs
  # two checks of its own: before building, that the lockfile holds no runtime package outside
  # @angular/*, rxjs and tslib (check-runtime-deps.mjs); after it, that index.html left wwwroot and
  # carries no inline code for the CSP to block (check-index.mjs, ADR-0013).
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: EclipsVault.AngularUi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # .nvmrc pins the same Node the Dockerfile's ui stage builds with.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: EclipsVault.AngularUi/.nvmrc
          cache: npm
          cache-dependency-path: EclipsVault.AngularUi/package-lock.json

      # `npm ci` installs exactly the lockfile, and fails if package.json no longer matches it.
      - name: Install (locked)
        run: npm ci --ignore-scripts

      # Regenerate from the web controllers without starting the vault or needing secrets/SQL Server.
      - name: Setup .NET for the UI API contract
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Check generated UI API types
        run: npm run check:api-types

      - name: Lint
        run: npm run lint

      # Fix a failure with `npm run format`.
      - name: Formatting
        run: npm run format:check

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Build-check tests
        run: npm run test:build-checks

      - name: Build
        run: npm run build

      # Dev packages too: a compromised build tool runs here and on every developer's machine.
      # High and critical fail the job. Fix one by upgrading the package or pinning a patched version
      # in `overrides`, never by suppressing the finding.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  # Real Chromium against the release Dockerfile, SQL Server and a TLS-terminating proxy (ADR-0011).
  # The harness generates disposable SQL/audit credentials; bootstrap credentials and KEK enter
  # through the test environment, with no repository secrets or development seeding.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: EclipsVault.AngularUi/.nvmrc
          cache: npm
          cache-dependency-path: EclipsVault.AngularUi/package-lock.json

      - name: Install (locked)
        working-directory: EclipsVault.AngularUi
        run: npm ci --ignore-scripts

      - name: Install Chromium
        working-directory: EclipsVault.AngularUi
        run: npx playwright install --with-deps chromium

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Build the production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: eclipsvault:e2e
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Browser end-to-end tests and guard probes
        working-directory: EclipsVault.AngularUi
        env:
          E2E_IMAGE: eclipsvault:e2e
        run: |
          Seed__AdminPassword="E2e-$(openssl rand -hex 24)"
          ECLIPSVAULT_KEK="$(openssl rand -base64 32)"
          export Seed__AdminPassword ECLIPSVAULT_KEK
          echo "::add-mask::$Seed__AdminPassword"
          echo "::add-mask::$ECLIPSVAULT_KEK"
          npm run e2e
          npm run e2e:verify-guards

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            EclipsVault.AngularUi/test-results/
            EclipsVault.AngularUi/playwright-report/
            EclipsVault.AngularUi/guard-results/
          if-no-files-found: ignore
          retention-days: 3

  # The vault targets two database engines, so every model change needs a migration in BOTH sets.
  # One that reaches only one engine leaves the schemas silently different, and nothing notices
  # until a deployment on the other engine hits a column that was never created. Neither check
  # needs a database — they compare the model to the committed snapshot.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Install EF tools
        run: dotnet tool install --global dotnet-ef

      - name: SQL Server migrations match the model
        run: dotnet ef migrations has-pending-model-changes -p EclipsVault.Infrastructure -s EclipsVault.Web -c EclipsVaultDbContext

      - name: PostgreSQL migrations match the model
        env:
          ECLIPSVAULT_DESIGN_PROVIDER: Postgres
        run: dotnet ef migrations has-pending-model-changes -p EclipsVault.Migrations.Postgres -s EclipsVault.Web -c EclipsVaultDbContext

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # appsettings.Development.json holds the dev KEK fallback and the seed passwords. It is
      # git-ignored, but an ignore rule is a convention and this is a vault — make it a gate.
      - name: Dev settings are not committed
        run: |
          if git ls-files --error-unmatch EclipsVault.Web/appsettings.Development.json > /dev/null 2>&1; then
            echo "::error::appsettings.Development.json is tracked — it carries the dev KEK and seed passwords"
            exit 1
          fi
          echo "OK — appsettings.Development.json is not tracked"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      # Fail the job if any referenced package has a known vulnerability.
      - name: Audit dependencies
        run: |
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::error::Vulnerable packages detected"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: EclipsVault.AngularUi/.nvmrc

      # The Angular UI's npm packages, dev and runtime, as the frontend job audits them. npm reads
      # the lockfile, so nothing needs installing.
      - name: Audit npm dependencies
        working-directory: EclipsVault.AngularUi
        run: npm audit --audit-level=high

      # The CycloneDX npm tool that writes the release's attested SBOM, locked beside its script.
      - name: Audit the SBOM tool's npm dependencies
        working-directory: .github/sbom
        run: npm audit --audit-level=high

  # The hook that stops coding agents running destructive git commands is itself security code,
  # and its first version had a bypass that only a test exposed. Run its test table on every change
  # so a broken pattern fails here instead of failing open on someone's machine.
  agent-guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Git guardrail hook blocks destructive commands and allows everyday ones
        run: python3 -I -m unittest discover -s .claude/hooks -p 'test_*.py' -v

  # The release workflow builds this Dockerfile, but it only ever runs on a v* tag — so before this
  # job existed, the first execution of the production image build was also its first test, on the
  # tag that was supposed to be the release. A Dockerfile break would surface as a failed release
  # rather than a failed PR, and recovering means deleting and re-pushing a tag that may already be
  # public. Build it here on every push so a tag only ever publishes something already proven to
  # build.
  #
  # Build only: no push, no registry credentials, no cosign. Signing needs the tag's OIDC identity
  # and a real digest in GHCR, so it stays in release.yml — this job de-risks the step that has no
  # such requirement. Kept deliberately identical to release.yml's build (same context, same action)
  # so it is a rehearsal and not merely a similar-looking build.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.38.0
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea

      - name: Build the production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          # GitHub's action cache keeps the restore/publish layers warm across runs; without it
          # every PR pays a full NuGet restore and publish.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: EclipsVault.AngularUi/.nvmrc

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      # A software bill of materials for the deployed app: every transitive NuGet package and the
      # Angular UI's npm runtime packages, so a consumer can audit what ships. Fits the pin-and-prove
      # supply-chain posture. Step for step this is release.yml's sbom job, whose output the release
      # attests to the image, so a change that breaks it fails here before it can fail a tag.
      - name: Generate SBOM
        run: bash .github/sbom/sbom.sh

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom
          path: sbom/sbom.json
          if-no-files-found: error
