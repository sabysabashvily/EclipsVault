# LOCAL DEVELOPMENT ONLY. This file is not a deployment.
#
# Everything here is real, open-source (or first-party) software, so the project runs the way it
# would in production rather than against hand-rolled mocks — but it is configured for a laptop:
# the passwords are in this file and therefore public, Vault runs in dev mode (in-memory, unsealed,
# with a known root token), and nothing speaks TLS. That is fine for a developer machine and
# indefensible anywhere else.
#
# Every port is published to 127.0.0.1 rather than 0.0.0.0. Docker publishes to all interfaces by
# default, which on a laptop on a café or office network hands PostgreSQL, Vault and Redis — with
# the credentials written below — to everyone on that network, and does it silently. Binding to
# loopback keeps these reachable from this machine only.
#
# Images are pinned to exact versions, not :latest. A floating tag means the thing you tested is
# not necessarily the thing that starts tomorrow, and a supply-chain compromise arrives on the next
# `docker compose pull` with nothing in the diff to show for it.
#
# Data worth keeping lives in named volumes (PostgreSQL and Redis). A cleanup that removes stopped
# containers and images leaves volumes alone, and `docker compose up -d` recreates everything else.
# The other services keep nothing worth keeping: Vault runs in memory by design, Mailpit's captured
# mail is disposable, and Keycloak imports its realm from source into every new container.
#
#   docker compose up -d --wait     # returns once every service runs and PostgreSQL is healthy
#   # one-time: enable Vault's Transit engine + create the master key (only if using VaultTransit)
#   curl -s -H "X-Vault-Token: dev-root" -X POST -d '{"type":"transit"}' http://127.0.0.1:8200/v1/sys/mounts/transit
#   curl -s -H "X-Vault-Token: dev-root" -X POST http://127.0.0.1:8200/v1/transit/keys/eclipsvault
#   Database__Provider=Postgres \
#   ConnectionStrings__DefaultConnection="Host=localhost;Port=5432;Database=EclipsVaultUmbraDb;Username=eclipsvault;Password=dev-postgres-password" \
#   dotnet run --project EclipsVault.Web
#
# UIs:  Mailpit  http://127.0.0.1:8025   ·   Vault  http://127.0.0.1:8200 (token: dev-root)

services:
  # PostgreSQL, pinned by digest to the image the integration tests run, so a local vault and the
  # tests exercise the same server build.
  db:
    image: postgres:17@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
    container_name: eclipsvault-postgres
    environment:
      POSTGRES_USER: "eclipsvault"
      POSTGRES_PASSWORD: "dev-postgres-password"
      POSTGRES_DB: "EclipsVaultUmbraDb"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - eclipsvault-postgres:/var/lib/postgresql/data
    healthcheck:
      # Over TCP rather than the default socket: on first start the image creates the database with
      # a temporary server that listens on the socket only, which would pass the check before
      # PostgreSQL accepts the vault's connections.
      test: ["CMD", "pg_isready", "--host=127.0.0.1", "--username=eclipsvault", "--dbname=EclipsVaultUmbraDb"]
      interval: 5s
      timeout: 5s
      retries: 12

  # HashiCorp Vault (dev mode) — holds the master key when Crypto:Engine=VaultTransit,
  # so the KEK never lives in the app process.
  #
  # Dev mode keeps everything in memory and auto-unseals with a known root token: it exists to
  # exercise the Transit code path, and loses every key on restart. A real deployment runs Vault
  # with storage, a seal, and tokens that are not printed in a compose file.
  vault:
    image: hashicorp/vault:1.18.5
    container_name: eclipsvault-vault
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"   # inside the container; published to loopback only
    ports:
      - "127.0.0.1:8200:8200"

  # Mailpit — an SMTP server with a web UI that captures every outbound notification email,
  # so the Notifications feature delivers for real in development.
  mailpit:
    image: axllent/mailpit:v1.27.11
    container_name: eclipsvault-mailpit
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # web UI

  # Redis — holds the shared distributed state (session revocation, the intrusion IP blacklist, and
  # the encrypted-envelope cache) when Redis:Enabled=true, so the app can run as multiple nodes
  # behind a load balancer. AOF persistence keeps blocks across restarts.
  #
  # It requires a password even here. Redis holds the answers to "is this session revoked?" and "is
  # this address blocked?", so anyone who can write it can un-revoke a session someone signed out of
  # and lift an intrusion block — no password meant the vault's kill switches were advisory to
  # anyone who could reach port 6379. Developing against an authenticated Redis also means the
  # production configuration is the one that has been exercised.
  redis:
    image: redis:7.4-alpine
    container_name: eclipsvault-redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "dev-redis-password"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - eclipsvault-redis:/data

  # Keycloak — a real OpenID Connect provider, so SSO is exercised against an actual IdP
  # (authorization code flow, discovery document, JWKS, real tokens) rather than a stub that
  # agrees with whatever the vault expects. The realm is imported from source, not clicked
  # together in the UI, so everyone gets the same IdP.
  #
  # Realm 'eclipsvault' ships two users, both with the dev-user password:
  #   devon@eclipsvault.local         — matches the seeded dev-user account, so sign-in succeeds
  #   idp-only-user@eclipsvault.local — genuine to the IdP, unknown to the vault, so it is refused
  #                                     (the vault decides who may in, not the IdP)
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: eclipsvault-keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "dev-admin"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "127.0.0.1:8081:8080"
    volumes:
      - ./keycloak/eclipsvault-realm.json:/opt/keycloak/data/import/eclipsvault-realm.json:ro

volumes:
  eclipsvault-postgres:
  eclipsvault-redis:
